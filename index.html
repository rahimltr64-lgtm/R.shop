<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXURY STORE | متجر الفخامة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --main: #2c3e50; 
            --accent: #e74c3c;
            --bg: linear-gradient(135deg, #eef2f3 0%, #dae2e8 100%); 
            --card-bg: rgba(255, 255, 255, 0.9); 
            --radius: 30px; 
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: 'Cairo', sans-serif; 
            margin: 0; background: var(--bg); 
            background-attachment: fixed;
            color: #34495e; overflow-x: hidden; 
        }
        header { 
            background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(15px);
            padding: 20px; text-align: center; position: sticky; top: 0; z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.3);
        }
        .logo { font-size: 20px; font-weight: 900; color: var(--main); letter-spacing: 4px; margin: 0; cursor: pointer; }
        
        .categories-nav {
            display: flex; gap: 10px; padding: 15px; overflow-x: auto;
            white-space: nowrap; background: rgba(238, 242, 243, 0.5);
            scrollbar-width: none;
        }
        .categories-nav::-webkit-scrollbar { display: none; }
        
        .cat-btn {
            padding: 8px 22px; background: #fff; border-radius: 15px;
            font-size: 14px; font-weight: 700; color: var(--main);
            border: 1px solid rgba(0,0,0,0.05); cursor: pointer; transition: 0.3s;
            flex-shrink: 0;
        }
        .cat-btn.active { background: var(--main); color: #fff; transform: scale(1.05); }

        .container { max-width: 500px; margin: auto; padding: 20px 15px; }
        
        #main-grid { display: grid; grid-template-columns: 1fr; gap: 20px; transition: opacity 0.3s ease; }
        .fade-out { opacity: 0; }

        .p-card { 
            background: var(--card-bg); border-radius: var(--radius); overflow: hidden; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.05); border: 1px solid rgba(255,255,255,0.6);
            transition: 0.3s ease; cursor: pointer;
        }
        .p-img-hold { width: 100%; height: 420px; padding: 20px; }
        .p-card img { width: 100%; height: 100%; object-fit: contain; }
        .p-info { padding: 20px; text-align: center; }
        .p-name { font-size: 18px; font-weight: 700; color: var(--main); }
        .p-price-tag { font-weight: 900; color: #2c3e50; font-size: 22px; display: block; }

        /* ستايل المؤقت الجديد */
        .timer-box {
            background: #fff5f5; border: 1px solid #feb2b2;
            padding: 12px; border-radius: 20px; margin: 15px 0;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .timer-text { color: var(--accent); font-weight: 700; font-size: 14px; }
        #timer-digits { color: var(--accent); font-weight: 900; font-size: 18px; letter-spacing: 1px; }

        #product-page { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #f4f7f9; z-index: 2000; overflow-y: auto;
        }
        .back-nav { padding: 20px; position: fixed; top: 0; width: 100%; z-index: 2001; }
        .close-circle { width: 45px; height: 45px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 15px rgba(0,0,0,0.05); cursor: pointer; }

        .hero-slider { width: 100%; height: 45vh; background: #fff; display: flex; align-items: center; border-radius: 0 0 50px 50px; }
        .hero-slider img { width: 100%; height: 85%; object-fit: contain; }
        .thumbs-strip { display: flex; gap: 12px; padding: 20px; overflow-x: auto; }
        .t-item { width: 70px; height: 70px; flex-shrink: 0; border-radius: 18px; border: 2px solid transparent; background: #fff; }
        .t-item.active { border-color: var(--main); }

        .order-form { padding: 0 20px 50px 20px; }
        .white-card { background: rgba(255,255,255,0.8); border-radius: 25px; padding: 25px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.5); }
        .final-price-box { background: var(--main); color: #fff; padding: 20px; border-radius: 25px; text-align: center; margin-bottom: 25px; }
        .final-price-box span { font-size: 30px; font-weight: 900; }
        
        input, select { width: 100%; padding: 16px; border-radius: 18px; border: 1px solid #dcdde1; margin-bottom: 12px; font-family: 'Cairo'; outline: none; }
        .btn-send { background: var(--main); color: #fff; border: none; width: 100%; padding: 20px; border-radius: 20px; font-size: 19px; font-weight: 700; cursor: pointer; }
        .success-overlay { position: fixed; inset: 0; background: #fff; z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    </style>
</head>
<body>

<header><div class="logo" onclick="location.hash=''; location.reload();">LUXURY STORE</div></header>

<div class="categories-nav">
    <div class="cat-btn active" onclick="filterCat('all', this)">الكل</div>
    <div class="cat-btn" onclick="filterCat('ملابس', this)">الملابس</div>
    <div class="cat-btn" onclick="filterCat('ساعات', this)">الساعات</div>
    <div class="cat-btn" onclick="filterCat('إلكترونيات', this)">إلكترونيات</div>
    <div class="cat-btn" onclick="filterCat('أحذية', this)">أحذية</div>
    <div class="cat-btn" onclick="filterCat('تجميل', this)">عطور</div>
</div>

<div class="container">
    <div class="product-grid" id="main-grid"></div>
</div>

<div id="product-page">
    <div class="back-nav"><div class="close-circle" onclick="closeP()">✕</div></div>
    <div id="p-content"></div>
</div>

<div class="success-overlay" id="successScreen">
    <div style="font-size: 80px; margin-bottom: 20px;">🕊️</div>
    <h1>تم استلام طلبك!</h1>
    <button class="btn-send" onclick="location.reload()" style="width: 150px;">حسناً</button>
</div>

<script>
    const TOKEN = "8447738345:AAHgpNg_aRPIZAZRsg1tJ4OGjYqA7Tl0ZjM"; 
    const CHAT_ID = "5981194410";

    const products = [
        {
            id: 1,
            category: "ملابس",
            name: "Armani Exchange Premium",
            price: 1000,
            colors: ["أبيض ملكي", "اسود فخم", "ازرق داكن", "عنابي", "أزرق بارد", "وردي", "اخضر بارد"],
            sizes: ["M", "L", "XL"],
            images: [
                "https://i.postimg.cc/3xYKhDnW/1778264788756.png", 
                "https://i.postimg.cc/SsfTkWHW/1778252993790.png", 
                "https://i.postimg.cc/pXTGM5CJ/1778251954636.png", 
                "https://i.postimg.cc/CKnhdK43/1778252936394.png", 
                "https://i.postimg.cc/xCn5xXq7/1778253038445.png", 
                "https://i.postimg.cc/FH8mt4Q0/1778253106574.png", 
                "https://i.postimg.cc/8C8tvKSK/1778252209457.png"
            ]
        }
    ];

    const wilayas = [
        {n: "01-أدرار", p: 1200}, {n: "02-الشلف", p: 800}, {n: "16-الجزائر", p: 400}, {n: "19-سطيف", p: 750} /* ... بقية الولايات ... */
    ];

    function render(f = 'all') {
        const g = document.getElementById('main-grid');
        g.classList.add('fade-out');
        setTimeout(() => {
            g.innerHTML = '';
            const filtered = products.filter(p => f === 'all' || p.category === f);
            if(filtered.length === 0) {
                g.innerHTML = '<div style="text-align:center; padding:50px; width:100%;">☕ قريباً جداً...</div>';
            } else {
                filtered.forEach(p => {
                    g.innerHTML += `<div class="p-card" onclick="openP(${p.id})"><div class="p-img-hold"><img src="${p.images[0]}"></div><div class="p-info"><div class="p-name">${p.name}</div><div class="p-price-tag">${p.price} DA</div></div></div>`;
                });
            }
            g.classList.remove('fade-out');
        }, 300);
    }

    function startTimer() {
        let duration = 2 * 60 * 60; // ساعتين بالثواني
        const display = document.getElementById('timer-digits');
        const interval = setInterval(() => {
            let hours = Math.floor(duration / 3600);
            let minutes = Math.floor((duration % 3600) / 60);
            let seconds = duration % 60;

            display.innerText = 
                (hours < 10 ? "0" + hours : hours) + ":" + 
                (minutes < 10 ? "0" + minutes : minutes) + ":" + 
                (seconds < 10 ? "0" + seconds : seconds);

            if (--duration < 0) clearInterval(interval);
        }, 1000);
    }

    function openP(id) {
        location.hash = id;
        const p = products.find(x => x.id === id);
        let w_opts = `<option value="none">اختر الولاية</option>` + wilayas.map(w => `<option value="${w.p}">${w.n}</option>`).join('');
        document.getElementById('p-content').innerHTML = `
            <div class="hero-slider"><img src="${p.images[0]}" id="activeImg"></div>
            <div class="thumbs-strip">${p.images.map((img, i) => `<img src="${img}" class="t-item ${i===0?'active':''}" onclick="changeGallery(this, '${img}')">`).join('')}</div>
            <div class="order-form">
                <div class="final-price-box"><span id="fPrice">${p.price}</span> DA</div>
                
                <div class="timer-box">
                    <span class="timer-text">🔥 ينتهي العرض خلال:</span>
                    <span id="timer-digits">02:45:00</span>
                </div>

                <div class="white-card">
                    <label>الكمية</label>
                    <select id="qty" onchange="updateTotal()"><option value="1">قطعة (1000 دج)</option><option value="2">قطعتين (1800 دج)</option></select>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-top:10px;">
                        <select id="c1">${p.colors.map(c => `<option value="${c}">${c}</option>`).join('')}</select>
                        <select id="s1">${p.sizes.map(s => `<option value="${s}">${s}</option>`).join('')}</select>
                    </div>
                </div>
                <div class="white-card">
                    <input type="text" id="n" placeholder="الإسم الكامل">
                    <input type="tel" id="ph" placeholder="رقم الهاتف">
                    <select id="w" onchange="updateTotal()">${w_opts}</select>
                    <input type="text" id="b" placeholder="البلدية / العنوان">
                </div>
                <button class="btn-send" onclick="send()">تأكيد الطلب الآن 🛍️</button>
                <p style="text-align:center; font-size:12px; color:#7f8c8d; margin-top:10px;">⚠️ الكمية محدودة جداً! قطع قليلة متبقية.</p>
            </div>`;
        document.getElementById('product-page').style.display = 'block';
        document.body.style.overflow = 'hidden';
        startTimer(); // تشغيل العداد عند فتح المنتج
    }

    function filterCat(c, el) {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
        el.scrollIntoView({ behavior: 'smooth', inline: 'center' });
        render(c);
    }

    function updateTotal() {
        const qty = document.getElementById('qty').value;
        const w_val = document.getElementById('w').value;
        let base = (qty === "2") ? 1800 : 1000;
        let ship = w_val === "none" ? 0 : parseInt(w_val);
        document.getElementById('fPrice').innerText = base + ship;
    }

    function send() {
        const n = document.getElementById('n').value, ph = document.getElementById('ph').value, w = document.getElementById('w'), b = document.getElementById('b').value;
        if(n && ph && w.value !== "none" && b) {
            const qty = document.getElementById('qty').value;
            let text = `📦 طلب جديد:\nالاسم: ${n}\nالهاتف: ${ph}\nالولاية: ${w.options[w.selectedIndex].text}\nالبلدية: ${b}\nالكمية: ${qty}\nالمجموع: ${document.getElementById('fPrice').innerText} DA`;
            fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chat_id: CHAT_ID, text: text }) })
            .then(() => document.getElementById('successScreen').style.display = 'flex');
        } else { alert("يرجى إكمال البيانات"); }
    }

    function changeGallery(el, src) {
        document.getElementById('activeImg').src = src;
        document.querySelectorAll('.t-item').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
    }

    function closeP() { 
        document.getElementById('product-page').style.display = 'none'; 
        document.body.style.overflow = 'auto';
        location.hash = '';
    }

    function checkUrl() {
        const hash = location.hash.replace('#', '');
        if(hash) {
            const id = parseInt(hash);
            const exists = products.find(p => p.id === id);
            if(exists) openP(id);
        }
    }

    render();
    checkUrl();
</script>
</body>
</html>
