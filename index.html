<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXURY STORE | فخامة التسوق</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --main: #111; --gold: #c5a059; --bg: #f8f9fa; --card-bg: #ffffff; }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Cairo', sans-serif; margin: 0; background: var(--bg); color: #222; overflow-x: hidden; }
        
        header { 
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);
            padding: 15px; text-align: center; position: sticky; top: 0; z-index: 1000;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .logo { font-size: 20px; font-weight: 900; color: var(--main); letter-spacing: 2px; margin: 0; }

        .container { max-width: 500px; margin: auto; padding: 15px; }

        /* كروت العرض الرئيسية */
        .product-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        .p-card { 
            background: var(--card-bg); border-radius: 25px; overflow: hidden; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.03);
        }
        .p-img-hold { width: 100%; height: 380px; background: #fff; }
        .p-card img { width: 100%; height: 100%; object-fit: cover; }
        .p-info { padding: 15px; text-align: center; }
        .p-price-tag { display: inline-block; margin-top: 8px; font-weight: 900; color: var(--main); font-size: 20px; }

        /* صفحة المنتج المتطورة */
        #product-page { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #f4f6f8; z-index: 2000; overflow-y: auto;
            animation: slideUp 0.4s ease-out;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .back-nav { padding: 15px; display: flex; align-items: center; background: transparent; position: absolute; top: 0; width: 100%; z-index: 2001; }
        .close-circle { width: 35px; height: 35px; background: rgba(255,255,255,0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 15px rgba(0,0,0,0.1); cursor: pointer; }

        /* المعرض */
        .hero-slider { width: 100%; height: 55vh; background: #fff; display: flex; align-items: center; border-radius: 0 0 40px 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .hero-slider img { width: 100%; height: 100%; object-fit: contain; }
        
        .thumbs-strip { display: flex; gap: 10px; padding: 15px; overflow-x: auto; }
        .thumbs-strip::-webkit-scrollbar { display: none; }
        .t-item { width: 65px; height: 65px; flex-shrink: 0; border-radius: 15px; border: 2px solid transparent; object-fit: cover; background: #fff; box-shadow: 0 5px 10px rgba(0,0,0,0.05); }
        .t-item.active { border-color: var(--main); transform: scale(1.05); }

        /* تفاصيل الطلب */
        .order-form { padding: 10px 20px 40px 20px; }
        .white-card { background: #fff; border-radius: 25px; padding: 20px; margin-bottom: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.02); }
        
        .price-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .final-price { font-size: 26px; font-weight: 900; color: var(--main); }

        .input-label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 700; color: #999; margin-right: 5px; }
        input, select { 
            width: 100%; padding: 14px; border-radius: 15px; border: 1px solid #eee; 
            background: #fcfcfc; font-family: 'Cairo'; font-size: 15px; outline: none; margin-bottom: 10px;
        }
        input:focus { border-color: var(--main); background: #fff; }

        .btn-send { 
            background: var(--main); color: #fff; border: none; width: 100%; 
            padding: 18px; border-radius: 18px; font-size: 18px; font-weight: 700;
            cursor: pointer; box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        .btn-send:active { transform: scale(0.97); }

        .success-page { position: fixed; inset: 0; background: #fff; z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; }
    </style>
</head>
<body>

<header><div class="logo">LUXURY STORE</div></header>

<div class="container" id="home-view">
    <div class="product-grid" id="main-grid"></div>
</div>

<div id="product-page">
    <div class="back-nav"><div class="close-circle" onclick="closeP()">✕</div></div>
    <div id="p-content"></div>
</div>

<div class="success-page" id="successScreen">
    <div style="font-size: 80px; margin-bottom: 20px;">📦</div>
    <h1>تم استلام طلبك!</h1>
    <p>شكراً لك يا <b id="clientName"></b>. سنتصل بك قريباً.</p>
    <button class="btn-send" onclick="location.reload()" style="width: 200px; margin-top: 20px;">العودة</button>
</div>

<script>
    const TOKEN = "8447738345:AAHgpNg_aRPIZAZRsg1tJ4OGjYqA7Tl0ZjM"; 
    const CHAT_ID = "5981194410";

    const products = [
        {
            id: 1,
            name: "Premium Summer T-Shirt",
            price: 1000,
            colors: ["ازرق داكن", "أبيض", "اسود", "عنابي", "أزرق بارد", "وردي", "اخضر بارد"],
            sizes: ["M", "L", "XL"],
            images: [
                "https://i.postimg.cc/SsfTkWHW/1778252993790.png", "https://i.postimg.cc/xCn5xXq7/1778253038445.png",
                "https://i.postimg.cc/pXTGM5CJ/1778251954636.png", "https://i.postimg.cc/76F8cM8b/1778253686102.png",
                "https://i.postimg.cc/FH8mt4Q0/1778253106574.png", "https://i.postimg.cc/CKnhdK43/1778252936394.png",
                "https://i.postimg.cc/8C8tvKSK/1778252209457.png"
            ]
        }
    ];

    const wilayas = [
        {n: "19-سطيف", p: 300}, {n: "16-الجزائر العاصمة", p: 400}, {n: "31-وهران", p: 600}, {n: "25-قسنطينة", p: 500},
        {n: "09-البليدة", p: 450}, {n: "34-برج بوعريريج", p: 500}, {n: "35-بومرداس", p: 500}
    ];

    const grid = document.getElementById('main-grid');
    products.forEach(p => {
        grid.innerHTML += `
            <div class="p-card" onclick="openP(${p.id})">
                <div class="p-img-hold"><img src="${p.images[0]}"></div>
                <div class="p-info">
                    <div style="font-weight:700;">${p.name}</div>
                    <div class="p-price-tag">${p.price} DA</div>
                </div>
            </div>`;
    });

    function openP(id) {
        const p = products.find(x => x.id === id);
        let w_opts = `<option value="none">اختر الولاية</option>` + wilayas.map(w => `<option value="${w.p}">${w.n}</option>`).join('');

        document.getElementById('p-content').innerHTML = `
            <div class="hero-slider"><img src="${p.images[0]}" id="activeImg"></div>
            <div class="thumbs-strip">${p.images.map((img, i) => `<img src="${img}" class="t-item ${i===0?'active':''}" onclick="changeGallery(this, '${img}')">`).join('')}</div>
            
            <div class="order-form">
                <div class="white-card">
                    <div class="price-row">
                        <span style="font-weight:700;">${p.name}</span>
                        <span class="final-price"><span id="finalPrice">${p.price}</span> DA</span>
                    </div>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                        <div><label class="input-label">اللون</label><select id="custColor">${p.colors.map(c => `<option value="${c}">${c}</option>`).join('')}</select></div>
                        <div><label class="input-label">المقاس</label><select id="custSize">${p.sizes.map(s => `<option value="${s}">${s}</option>`).join('')}</select></div>
                    </div>
                </div>

                <div class="white-card">
                    <label class="input-label">معلومات الشحن</label>
                    <input type="text" id="custN" placeholder="الإسم الكامل">
                    <input type="tel" id="custPh" placeholder="رقم الهاتف">
                    <select id="custW" onchange="updateTotal()">${w_opts}</select>
                    <select id="deliveryType" onchange="updateTotal()">
                        <option value="home">توصيل للمنزل</option>
                        <option value="office">استلام من المكتب (-200 دج)</option>
                    </select>
                    <input type="text" id="custC" placeholder="البلدية والعنوان">
                </div>
                
                <button class="btn-send" id="sendBtn" onclick="send()">تأكيد الطلبية 🛍️</button>
            </div>`;
        document.getElementById('product-page').style.display = 'block';
        document.body.style.overflow = 'hidden';
    }

    function changeGallery(el, src) {
        document.getElementById('activeImg').src = src;
        document.querySelectorAll('.t-item').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
    }

    function updateTotal() {
        const p = products[0];
        const w_val = document.getElementById('custW').value;
        const d_type = document.getElementById('deliveryType').value;
        let shipping = w_val === "none" ? 0 : parseInt(w_val);
        if(d_type === "office" && shipping > 200) shipping -= 200;
        document.getElementById('finalPrice').innerText = p.price + shipping;
    }

    function send() {
        const n = document.getElementById('custN').value;
        const ph = document.getElementById('custPh').value;
        if(n && ph && document.getElementById('custW').value !== "none") {
            document.getElementById('sendBtn').innerText = "جاري الإرسال...";
            const msg = `🚀 طلب جديد!\n👤 العميل: ${n}\n📞 الهاتف: ${ph}\n📍 الولاية: ${document.getElementById('custW').options[document.getElementById('custW').selectedIndex].text}\n🎨 اللون: ${document.getElementById('custColor').value}\n📏 المقاس: ${document.getElementById('custSize').value}\n💰 الإجمالي: ${document.getElementById('finalPrice').innerText} DA`;
            
            fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, text: msg })
            }).then(res => {
                if(res.ok) {
                    document.getElementById('clientName').innerText = n;
                    document.getElementById('successScreen').style.display = 'flex';
                }
            });
        } else { alert("يرجى ملء البيانات"); }
    }

    function closeP() { 
        document.getElementById('product-page').style.display = 'none'; 
        document.body.style.overflow = 'auto';
    }
</script>
</body>
</html>
