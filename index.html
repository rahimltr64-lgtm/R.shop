<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXURY STORE | فخامة التسوق</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --main: #000000; --accent: #1a1a1a; --gold: #c5a059; --bg: #fdfdfd; --card-bg: #ffffff; }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Cairo', sans-serif; margin: 0; background: var(--bg); color: #222; overflow-x: hidden; }
        
        /* هيدر عصري وسلس */
        header { 
            background: rgba(255, 255, 255, 0.8); 
            backdrop-filter: blur(10px);
            padding: 18px; text-align: center; 
            position: sticky; top: 0; z-index: 1000;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .logo { font-size: 22px; font-weight: 900; color: var(--main); letter-spacing: 3px; margin: 0; }

        .container { max-width: 500px; margin: auto; padding: 20px; }

        /* كروت المنتجات المتطورة */
        .product-grid { display: grid; grid-template-columns: 1fr; gap: 30px; }
        .p-card { 
            background: var(--card-bg); border-radius: 30px; overflow: hidden; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(0,0,0,0.02);
        }
        .p-card:active { transform: scale(0.96); }
        .p-img-hold { position: relative; width: 100%; height: 420px; overflow: hidden; }
        .p-card img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .p-info { padding: 20px; text-align: center; }
        .p-info h3 { margin: 0; font-size: 19px; font-weight: 700; color: #333; }
        .p-price-tag { 
            display: inline-block; margin-top: 10px; padding: 5px 20px; 
            background: #f0f0f0; border-radius: 50px; font-weight: 900; color: var(--main);
        }

        /* صفحة المنتج (انزلاق من الأسفل) */
        #product-page { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #fff; z-index: 2000; overflow-y: auto;
            animation: slideUp 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .back-nav { padding: 15px; display: flex; align-items: center; justify-content: space-between; }
        .close-circle { width: 40px; height: 40px; background: #f5f5f5; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        /* معرض الصور السلس */
        .hero-slider { width: 100%; height: 50vh; background: #fff; position: relative; }
        .hero-slider img { width: 100%; height: 100%; object-fit: contain; }
        
        .thumbs-strip { 
            display: flex; gap: 12px; padding: 20px; overflow-x: auto; 
            scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
        }
        .thumbs-strip::-webkit-scrollbar { display: none; }
        .t-item { 
            width: 80px; height: 80px; flex-shrink: 0; border-radius: 20px; 
            border: 2px solid transparent; transition: 0.3s; object-fit: cover;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .t-item.active { border-color: var(--main); transform: scale(1.1); }

        /* نموذج طلب احترافي */
        .order-form { 
            background: #fff; border-radius: 40px 40px 0 0; padding: 30px 20px; 
            box-shadow: 0 -10px 40px rgba(0,0,0,0.03); 
        }
        .total-card { 
            background: var(--main); color: #fff; padding: 20px; border-radius: 25px;
            text-align: center; margin-bottom: 25px;
        }
        .total-card small { opacity: 0.7; font-size: 12px; }
        .total-card div { font-size: 28px; font-weight: 900; }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 700; color: #888; }
        input, select { 
            width: 100%; padding: 16px; border-radius: 18px; border: 1px solid #eee; 
            background: #fcfcfc; font-family: 'Cairo'; font-size: 16px; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--main); background: #fff; box-shadow: 0 10px 20px rgba(0,0,0,0.03); }

        .btn-send { 
            background: var(--main); color: #fff; border: none; width: 100%; 
            padding: 20px; border-radius: 20px; font-size: 18px; font-weight: 700;
            cursor: pointer; margin-top: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: 0.3s;
        }
        .btn-send:active { transform: scale(0.95); }

        /* شاشة النجاح المودرن */
        .success-page { 
            position: fixed; inset: 0; background: #fff; z-index: 9999; 
            display: none; flex-direction: column; align-items: center; justify-content: center; padding: 30px;
        }
        .check-icon { width: 100px; height: 100px; background: #000; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 50px; margin-bottom: 20px; }
    </style>
</head>
<body>

<header><div class="logo">LUXURY STORE</div></header>

<div class="container" id="home-view">
    <div class="product-grid" id="main-grid"></div>
</div>

<div id="product-page">
    <div class="back-nav">
        <div class="close-circle" onclick="closeP()">✕</div>
        <div style="font-weight: 700;">تفاصيل المنتج</div>
        <div style="width:40px;"></div>
    </div>
    <div id="p-content"></div>
</div>

<div class="success-page" id="successScreen">
    <div class="check-icon">✓</div>
    <h1 style="margin:0;">تم الإرسال!</h1>
    <p style="color:#777; text-align: center;">سنتصل بك يا <b id="clientName"></b> لتأكيد عنوان الشحن.</p>
    <button class="btn-send" onclick="location.reload()" style="width: 200px;">فهمت</button>
</div>

<script>
    const TOKEN = "8447738345:AAHgpNg_aRPIZAZRsg1tJ4OGjYqA7Tl0ZjM"; 
    const CHAT_ID = "5981194410";

    const products = [
        {
            id: 1,
            name: "Premium Summer T-Shirt",
            price: 1000,
            colors: ["ازرق داكن", "أبيض", "اسود", "عنابي", "أزرق بارد", "وردي", "اخضر بارد"],
            sizes: ["M", "L", "XL"],
            images: [
                "https://i.postimg.cc/SsfTkWHW/1778252993790.png", "https://i.postimg.cc/xCn5xXq7/1778253038445.png",
                "https://i.postimg.cc/pXTGM5CJ/1778251954636.png", "https://i.postimg.cc/76F8cM8b/1778253686102.png",
                "https://i.postimg.cc/FH8mt4Q0/1778253106574.png", "https://i.postimg.cc/CKnhdK43/1778252936394.png",
                "https://i.postimg.cc/8C8tvKSK/1778252209457.png"
            ]
        }
    ];

    const wilayas = [
        {n: "19-سطيف", p: 300}, {n: "16-الجزائر العاصمة", p: 400}, {n: "31-وهران", p: 600}, {n: "25-قسنطينة", p: 500},
        {n: "09-البليدة", p: 450}, {n: "34-برج بوعريريج", p: 500}, {n: "35-بومرداس", p: 500}
        // يمكن إضافة البقية هنا بنفس النمط
    ];

    const grid = document.getElementById('main-grid');
    products.forEach(p => {
        grid.innerHTML += `
            <div class="p-card" onclick="openP(${p.id})">
                <div class="p-img-hold"><img src="${p.images[0]}"></div>
                <div class="p-info">
                    <h3>${p.name}</h3>
                    <div class="p-price-tag">${p.price} DA</div>
                </div>
            </div>`;
    });

    let current = null;
    function openP(id) {
        current = products.find(x => x.id === id);
        let w_opts = `<option value="none">اختر الولاية</option>` + wilayas.map(w => `<option value="${w.p}">${w.n}</option>`).join('');

        document.getElementById('p-content').innerHTML = `
            <div class="hero-slider"><img src="${current.images[0]}" id="activeImg"></div>
            <div class="thumbs-strip">${current.images.map((img, i) => `<img src="${img}" class="t-item ${i===0?'active':''}" onclick="changeGallery(this, '${img}')">`).join('')}</div>
            
            <div class="order-form">
                <div class="total-card">
                    <small>المبلغ الإجمالي للدفع</small>
                    <div><span id="finalPrice">${current.price}</span> DA</div>
                </div>

                <div class="input-group">
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
                        <div><label>اللون</label><select id="custColor">${current.colors.map(c => `<option value="${c}">${c}</option>`).join('')}</select></div>
                        <div><label>المقاس</label><select id="custSize">${current.sizes.map(s => `<option value="${s}">${s}</option>`).join('')}</select></div>
                    </div>
                </div>

                <div class="input-group"><label>الإسم بالكامل</label><input type="text" id="custN" placeholder="مثال: محمد صالح"></div>
                <div class="input-group"><label>رقم الهاتف</label><input type="tel" id="custPh" placeholder="06XXXXXXXX"></div>
                
                <div class="input-group">
                    <label>الولاية والشحن</label>
                    <select id="custW" onchange="updateTotal()">${w_opts}</select>
                </div>
                
                <div class="input-group">
                    <label>نوع التوصيل</label>
                    <select id="deliveryType" onchange="updateTotal()">
                        <option value="home">توصيل للمنزل</option>
                        <option value="office">استلام من المكتب (خصم 200 دج)</option>
                    </select>
                </div>

                <div class="input-group"><label>العنوان بالتفصيل</label><input type="text" id="custC" placeholder="البلدية، اسم الشارع، رقم المنزل"></div>
                
                <button class="btn-send" id="sendBtn" onclick="send()">إتمام الطلب الآن</button>
            </div>`;
        document.getElementById('product-page').style.display = 'block';
        document.body.style.overflow = 'hidden';
    }

    function changeGallery(el, src) {
        document.getElementById('activeImg').src = src;
        document.querySelectorAll('.t-item').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
    }

    function updateTotal() {
        const w_val = document.getElementById('custW').value;
        const d_type = document.getElementById('deliveryType').value;
        let shipping = w_val === "none" ? 0 : parseInt(w_val);
        if(d_type === "office" && shipping > 200) shipping -= 200;
        document.getElementById('finalPrice').innerText = current.price + shipping;
    }

    function send() {
        const n = document.getElementById('custN').value;
        const ph = document.getElementById('custPh').value;
        const w_sel = document.getElementById('custW');
        
        if(n && ph && w_sel.value !== "none") {
            document.getElementById('sendBtn').innerText = "جاري التأكيد...";
            const msg = `🚀 طلب جديد!\n━━━━━━━━━━━━\n👤 العميل: ${n}\n📞 الهاتف: ${ph}\n📍 الولاية: ${w_sel.options[w_sel.selectedIndex].text}\n🎨 اللون: ${document.getElementById('custColor').value}\n📏 المقاس: ${document.getElementById('custSize').value}\n💰 الإجمالي: ${document.getElementById('finalPrice').innerText} DA`;
            
            fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, text: msg })
            }).then(res => {
                if(res.ok) {
                    document.getElementById('clientName').innerText = n;
                    document.getElementById('successScreen').style.display = 'flex';
                }
            });
        } else { alert("يرجى إكمال البيانات الأساسية أولاً"); }
    }

    function closeP() { 
        document.getElementById('product-page').style.display = 'none'; 
        document.body.style.overflow = 'auto';
    }
</script>
</body>
</html>
