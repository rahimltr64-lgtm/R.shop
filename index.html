<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXURY STORE | الأناقة الانسيابية الهادئة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090d16; /* خلفية ليلية هادئة جداً وعميقة */
            --card-bg: #131b2e; /* بطاقات ناعمة مدمجة بصرياً */
            --accent-gold: #f59e0b;
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
            --text-main: #f1f5f9;
            --text-muted: #64748b;
            --border-smooth: #1e293b;
        }

        * { box-sizing: border-box; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); } /* حركة بطيئة وانسيابية */
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-dark); color: var(--text-main); margin: 0; padding: 0; }

        /* شريط الإعلان العلوي المنحني وبسيط */
        .promo-banner {
            background: #131b2e;
            color: var(--text-main); padding: 12px; text-align: center; font-weight: 600;
            font-size: 13px; display: flex; justify-content: center; align-items: center; gap: 15px;
            border-bottom: 1px solid var(--border-smooth);
        }
        .countdown-timer { background: #090d16; color: var(--accent-gold); padding: 4px 14px; border-radius: 20px; font-family: monospace; font-size: 15px; font-weight: 700; }

        /* هيدر ناعم بدون زوايا حادة */
        header { background: var(--bg-dark); padding: 25px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; font-size: 22px; font-weight: 900; letter-spacing: 0.5px; }

        /* أزرار التنقل والمفضلة بانحناء كامل */
        .nav-buttons { display: flex; gap: 15px; align-items: center; }
        .btn-fav-toggle { background: #131b2e; border: 1px solid var(--border-smooth); color: var(--text-main); padding: 10px 22px; border-radius: 30px; font-family: 'Cairo'; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .btn-fav-toggle:hover, .btn-fav-toggle.active { background: var(--accent-red); color: white; border-color: var(--accent-red); }

        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }

        /* بار الأقسام بانحناء بيضاوي كامل ومريح */
        .categories-bar { display: flex; gap: 12px; margin-bottom: 35px; overflow-x: auto; padding-bottom: 8px; }
        .cat-btn { background: #131b2e; border: 1px solid var(--border-smooth); color: var(--text-muted); padding: 10px 24px; border-radius: 30px; cursor: pointer; font-family: 'Cairo'; font-weight: 700; white-space: nowrap; }
        .cat-btn.active, .cat-btn:hover { background: var(--accent-blue); border-color: var(--accent-blue); color: white; }

        /* شبكة المنتجات ذات الانحناءات الفخمة الكبيرة */
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 30px; }
        
        /* الكارت الفخم المنحني والمطفي بدون زوايا */
        .product-card { background: var(--card-bg); border-radius: 32px; border: 1px solid var(--border-smooth); overflow: hidden; position: relative; display: flex; flex-direction: column; }
        .product-card:hover { transform: translateY(-6px); border-color: #334155; }

        /* زر المفضلة الدائري تماماً */
        .fav-heart-btn { position: absolute; top: 18px; left: 18px; background: rgba(9, 13, 22, 0.7); border: none; color: #fff; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; font-size: 18px; backdrop-filter: blur(4px); }
        .fav-heart-btn.is-fav { color: var(--accent-red); background: #fff; }

        /* حاوية الصورة المستديرة والناعمة */
        .product-img-wrapper { width: 90%; height: 260px; background: #ffffff; position: relative; margin: 15px auto 0 auto; border-radius: 24px; overflow: hidden; }
        .product-img-wrapper img { width: 100%; height: 100%; object-fit: contain; padding: 12px; }

        /* شارة الطوارئ (المخزون) الدائرية الأنيقة */
        .stock-badge { position: absolute; bottom: 12px; right: 12px; background: rgba(239, 68, 68, 0.85); color: white; padding: 6px 14px; border-radius: 20px; font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 5px; box-shadow: 0 4px 12px rgba(239,68,68,0.2); }

        /* تفاصيل السلعة الهادئة */
        .product-details { padding: 22px; display: flex; flex-direction: column; flex-grow: 1; }
        .product-title { margin: 0 0 12px 0; font-size: 16px; font-weight: 700; color: #fff; line-height: 1.4; }
        .product-meta { color: var(--text-muted); font-size: 13px; margin-bottom: 15px; display: flex; justify-content: space-between; }
        .product-price { font-size: 19px; font-weight: 900; color: var(--accent-gold); margin-top: auto; margin-bottom: 16px; }

        /* أزرار الطلب الفورية المقوسة بالكامل */
        .btn-buy { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border: 1px solid var(--border-smooth); color: white; padding: 14px; border-radius: 25px; font-family: 'Cairo'; font-weight: 700; font-size: 14px; cursor: pointer; width: 100%; text-align: center; }
        .btn-buy:hover { background: linear-gradient(135deg, var(--accent-blue) 0%, #1d4ed8 100%); border-color: var(--accent-blue); }

        /* نافذة الشراء المنبثقة المستديرة والراقية */
        .modal-overlay { position: fixed; inset: 0; background: rgba(9, 13, 22, 0.8); backdrop-filter: blur(10px); z-index: 5000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.show { display: flex; }
        .modal-box { background: var(--card-bg); border-radius: 36px; padding: 35px; width: 100%; max-width: 480px; position: relative; border: 1px solid var(--border-smooth); box-shadow: 0 25px 50px rgba(0,0,0,0.4); }
        .modal-close { position: absolute; top: 22px; left: 22px; background: #1e293b; border: none; color: #fff; border-radius: 50%; width: 34px; height: 34px; cursor: pointer; }

        /* مدخلات وقوائم منحنية بالكامل */
        input, select { width: 100%; padding: 14px 20px; background: #090d16; border: 1px solid var(--border-smooth); color: #fff; border-radius: 25px; margin-bottom: 15px; font-family: 'Cairo'; font-size: 14px; }
        input:focus, select:focus { border-color: var(--accent-blue); outline: none; }
        ::placeholder { color: #475569; }
    </style>
</head>
<body>

<div class="promo-banner">
    <span>✨ عرض حصري ومحدود لفترة وجيزة! التوصيل متوفر لجميع الولايات والدفع عند الاستلام</span>
    <div class="countdown-timer" id="promoCountdown">02:45:12</div>
</div>

<header>
    <h1>🛍️ LUXURY STORE</h1>
    <div class="nav-buttons">
        <button class="btn-fav-toggle" id="favToggleBtn" onclick="toggleFavFilter()">
            <span>❤️ المفضلة</span>
            <span id="favCountBadge" style="background:var(--accent-red); color:white; border-radius:50%; padding:1px 6px; font-size:11px; margin-right:5px;">0</span>
        </button>
    </div>
</header>

<div class="container">
    <div class="categories-bar" id="categoriesBar">
        <button class="cat-btn active" onclick="filterCategory('الكل', this)">الكل 🌍</button>
        <button class="cat-btn" onclick="filterCategory('ملابس', this)">ملابس 👕</button>
        <button class="cat-btn" onclick="filterCategory('ساعات', this)">ساعات ⌚</button>
        <button class="cat-btn" onclick="filterCategory('إلكترونيات', this)">إلكترونيات 💻</button>
        <button class="cat-btn" onclick="filterCategory('أحذية', this)">أحذية 👟</button>
        <button class="cat-btn" onclick="filterCategory('عطور', this)">عطور 🧪</button>
    </div>

    <div class="products-grid" id="productsContainer">
        </div>
</div>

<div class="modal-overlay" id="orderModal" onclick="closeOrderModal(event)">
    <div class="modal-box">
        <button class="modal-close" onclick="closeOrderModal()">✕</button>
        <h2 style="margin-top:0; font-size:20px; font-weight:700;" id="modalProductTitle">تأكيد طلب الشراء</h2>
        <p style="color:var(--text-muted); font-size:13px; margin-bottom:20px;">يرجى تزويدنا بمعلوماتك بدقة للشحن السريع.</p>
        
        <form id="orderForm">
            <input type="text" id="custName" placeholder="الاسم واللقب" required>
            <input type="tel" id="custPhone" placeholder="رقم الهاتف الحقيقي" required>
            <input type="text" id="custWilaya" placeholder="الولاية والعنوان السكني" required>
            
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
                <select id="custColor" required><option value="">اختر اللون</option></select>
                <select id="custSize" required><option value="">اختر المقاس</option></select>
            </div>
            
            <div style="margin: 20px 0; font-weight: 700; color:#fff; display:flex; justify-content:space-between; border-top:1px solid var(--border-smooth); padding-top:15px;">
                <span>المبلغ الإجمالي المستحق:</span>
                <span id="modalProductPrice" style="color:var(--accent-gold); font-size:18px;">0 DA</span>
            </div>

            <button type="button" class="btn-buy" style="border-radius:30px;" onclick="submitOrder()">⚡ تأكيد طلب الشراء الآن</button>
        </form>
    </div>
</div>

<script>
    const CONFIG = {
        FIREBASE_BASE_URL: "https://fast-store-5cb17-default-rtdb.firebaseio.com"
    };

    let allProducts = {};
    let favoriteIds = JSON.parse(localStorage.getItem('storeFavorites')) || [];
    let currentCategory = 'الكل';
    let showFavoritesOnly = false;
    let selectedProduct = null;

    function startPromoCountdown() {
        let hours = 2, minutes = 45, seconds = 12;
        const timerEl = document.getElementById('promoCountdown');
        setInterval(() => {
            seconds--;
            if (seconds < 0) { seconds = 59; minutes--; }
            if (minutes < 0) { minutes = 59; hours--; }
            if (hours < 0) { hours = 3; minutes = 0; seconds = 0; }
            let hStr = hours < 10 ? '0' + hours : hours;
            let mStr = minutes < 10 ? '0' + minutes : minutes;
            let sStr = seconds < 10 ? '0' + seconds : seconds;
            timerEl.innerText = `${hStr}:${mStr}:${sStr}`;
        }, 1000);
    }

    async function fetchStoreProducts() {
        try {
            const res = await fetch(`${CONFIG.FIREBASE_BASE_URL}/products.json`);
            allProducts = await res.json() || {};
            renderStoreProducts(); updateFavBadge();
        } catch (e) { console.error(e); }
    }

    function renderStoreProducts() {
        const container = document.getElementById('productsContainer');
        container.innerHTML = '';
        const keys = Object.keys(allProducts);
        let displayedCount = 0;

        keys.forEach(key => {
            const prod = allProducts[key]; if(!prod) return;
            if (currentCategory !== 'الكل' && prod.category !== currentCategory) return;
            if (showFavoritesOnly && !favoriteIds.includes(prod.id.toString())) return;

            displayedCount++;
            const isFav = favoriteIds.includes(prod.id.toString());
            const mainImg = (prod.images && prod.images.length > 0) ? prod.images[0] : 'https://placehold.co/300';
            const fakeStock = Math.floor(Math.random() * 3) + 2;

            container.innerHTML += `
                <div class="product-card">
                    <button class="fav-heart-btn ${isFav ? 'is-fav' : ''}" onclick="toggleFavorite('${prod.id}', this)">❤️</button>
                    <div class="product-img-wrapper">
                        <img src="${mainImg}" onerror="this.src='https://placehold.co/300'">
                        <div class="stock-badge">⚠️ متبقي ${fakeStock} قطع فقط!</div>
                    </div>
                    <div class="product-details">
                        <h3 class="product-title">${prod.name}</h3>
                        <div class="product-meta">
                            <span>القسم: <strong>${prod.category}</strong></span>
                            <span>📦 الدفع عند الاستلام</span>
                        </div>
                        <div class="product-price">${prod.price.toLocaleString('ar')} DA</div>
                        <button class="btn-buy" onclick="openOrderModal('${key}')">🛒 اطلب الآن</button>
                    </div>
                </div>`;
        });

        if (displayedCount === 0) {
            container.innerHTML = `<p style="grid-column:1/-1; text-align:center; color:var(--text-muted); padding:50px;">لا توجد سلع هنا حالياً.</p>`;
        }
    }

    function toggleFavorite(id, btn) {
        id = id.toString();
        if (favoriteIds.includes(id)) { favoriteIds = favoriteIds.filter(favId => favId !== id); btn.classList.remove('is-fav'); }
        else { favoriteIds.push(id); btn.classList.add('is-fav'); }
        localStorage.setItem('storeFavorites', JSON.stringify(favoriteIds));
        updateFavBadge(); if (showFavoritesOnly) renderStoreProducts();
    }

    function updateFavBadge() { document.getElementById('favCountBadge').innerText = favoriteIds.length; }

    function toggleFavFilter() {
        showFavoritesOnly = !showFavoritesOnly;
        const btn = document.getElementById('favToggleBtn');
        if (showFavoritesOnly) btn.classList.add('active'); else btn.classList.remove('active');
        renderStoreProducts();
    }

    function filterCategory(cat, btn) {
        currentCategory = cat;
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderStoreProducts();
    }

    function openOrderModal(key) {
        selectedProduct = allProducts[key]; if(!selectedProduct) return;
        document.getElementById('modalProductTitle').innerText = `طلب شراء: ${selectedProduct.name}`;
        document.getElementById('modalProductPrice').innerText = `${selectedProduct.price.toLocaleString('ar')} DA`;

        const colorSelect = document.getElementById('custColor'); colorSelect.innerHTML = '<option value="">اختر اللون</option>';
        if (selectedProduct.colors) { selectedProduct.colors.forEach(c => colorSelect.innerHTML += `<option value="${c}">${c}</option>`); }

        const sizeSelect = document.getElementById('custSize'); sizeSelect.innerHTML = '<option value="">اختر المقاس</option>';
        if (selectedProduct.sizes) { selectedProduct.sizes.forEach(s => sizeSelect.innerHTML += `<option value="${s}">${s}</option>`); }

        document.getElementById('orderModal').classList.add('show');
    }

    function closeOrderModal(e) { if (!e || e.target === document.getElementById('orderModal') || e.target.className === 'modal-close') document.getElementById('orderModal').classList.remove('show'); }

    async function submitOrder() {
        const name = document.getElementById('custName').value.trim();
        const phone = document.getElementById('custPhone').value.trim();
        const wilaya = document.getElementById('custWilaya').value.trim();
        const color = document.getElementById('custColor').value;
        const size = document.getElementById('custSize').value;

        if(!name || !phone || !wilaya || !color || !size) { alert("يرجى ملء البيانات واختيار المقاس واللون!"); return; }

        const orderId = "ORD-" + Math.floor(100000 + Math.random() * 900000);
        const orderData = {
            orderId, name, phone, wilaya,
            product: `${selectedProduct.name} (${color} - ${size})`,
            productId: selectedProduct.id,
            totalPrice: selectedProduct.price,
            status: "قيد الانتظار"
        };

        try {
            await fetch(`${CONFIG.FIREBASE_BASE_URL}/orders/${orderId}.json`, {
                method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(orderData)
            });
            alert(`🎯 تم تسجيل طلبك بنجاح برقم: ${orderId}. سيتصل بك فريق الدعم الهاتفي فوراً.`);
            document.getElementById('orderForm').reset(); closeOrderModal();
        } catch(e) { alert("❌ خطأ بالاتصال السحابي."); }
    }

    startPromoCountdown();
    fetchStoreProducts();
</script>
</body>
</html>
