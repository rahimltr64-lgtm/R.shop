<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجري السحابي السريع</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --main-color: #2c3e50;
            --accent-color: #e74c3c;
            --bg-color: #f8f9fa;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            color: #333;
        }
        header {
            background-color: var(--main-color);
            color: white;
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        header h1 { margin: 0; font-size: 24px; font-weight: 900; }
        
        .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }
        
        /* Grid المنتجات */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }
        .product-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .product-card:hover { transform: translateY(-5px); }
        .product-image { width: 100%; height: 250px; object-fit: cover; background: #eee; }
        .product-info { padding: 20px; text-align: center; }
        .product-title { font-size: 18px; font-weight: 700; margin: 0 0 10px 0; color: var(--main-color); }
        .product-price { font-size: 20px; font-weight: 900; color: var(--accent-color); margin-bottom: 15px; }
        
        .btn-buy {
            background-color: var(--main-color);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            font-family: 'Cairo';
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            border-radius: 0 0 20px 20px;
            transition: 0.3s;
        }
        .btn-buy:hover { background-color: var(--accent-color); }

        /* نافذة الشراء الشاملة (Modal) */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 5000;
            display: none; align-items: center; justify-content: center; padding: 20px;
        }
        .modal.show { display: flex; }
        .modal-box {
            background: white; border-radius: 25px; padding: 30px; width: 100%; max-width: 450px;
            text-align: center; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .modal-close { position: absolute; top: 15px; left: 15px; background: #eee; border: none; border-radius: 50%; width: 35px; height: 35px; cursor: pointer; }
        
        input, select {
            width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #ccc; margin-bottom: 15px; font-family: 'Cairo'; box-sizing: border-box;
        }
        .btn-submit { background-color: #27ae60; color: white; border: none; font-weight: 700; font-size: 18px; cursor: pointer; }
        
        /* حالة التحميل */
        .loading-text { text-align: center; font-size: 18px; font-weight: 700; padding: 5px; color: #888; grid-column: 1/-1; }
    </style>
</head>
<body>

<header>
    <h1>🛍️ متجرنا السحابي الجديد</h1>
</header>

<div class="container">
    <div class="products-grid" id="productsContainer">
        <p class="loading-text">جاري تحميل المنتجات الرائعة من السحاب... 🔄</p>
    </div>
</div>

<div class="modal" id="orderModal">
    <div class="modal-box">
        <button class="modal-close" onclick="closeOrderModal()">✕</button>
        <h3 id="modalProductTitle" style="color: var(--main-color); margin-top: 0;">طلب منتج</h3>
        <p id="modalProductPrice" style="color: var(--accent-color); font-weight: 900; font-size: 18px;"></p>
        
        <input type="text" id="clientName" placeholder="اسمك الكامل">
        <input type="tel" id="clientPhone" placeholder="رقم الهاتف (الرجاء التأكد منه)">
        
        <select id="clientWilaya">
            <option value="">اختر ولايتك</option>
            <option value="سطيف">01 - سطيف</option>
            <option value="الجزائر">16 - الجزائر العاصمة</option>
            <option value="وهران">31 - وهران</option>
            <option value="قسنطينة">25 - قسنطينة</option>
            <option value="عنابة">23 - عنابة</option>
            </select>

        <select id="selectedColor" placeholder="اختر اللون"></select>
        <select id="selectedSize" placeholder="اختر المقاس"></select>

        <input type="button" class="btn-submit" value="🎯 تأكيد الطلب الآن" onclick="submitOrder()">
    </div>
</div>

<script>
    const FIREBASE_BASE_URL = "https://fast-store-5cb17-default-rtdb.firebaseio.com";
    const TELEGRAM_BOT_TOKEN = "7749457223:AAE_w6_Wp3b7h44lCAt0pZ55yXgqXonG62I";
    const TELEGRAM_CHAT_ID = "6348888914";

    let currentProduct = null;

    // 1. جلب المنتجات السحابية من Firebase وعرضها
    async function fetchCloudProducts() {
        try {
            const response = await fetch(`${FIREBASE_BASE_URL}/products.json`);
            const data = await response.json();
            const container = document.getElementById('productsContainer');
            
            if (!data) {
                container.innerHTML = `<p class="loading-text">لا توجد منتجات معروضة حالياً. اذهب للوحة التحكم وأضف أول منتج! ➕</p>`;
                return;
            }

            container.innerHTML = ''; // تنظيف نص التحميل

            // تحويل الكائن القادم من الـ Firebase إلى مصفوفة وعرضها
            Object.keys(data).forEach(key => {
                const p = data[key];
                // نستخدم أول صورة في المصفوفة كصورة رئيسية للمنتج
                const mainImage = (p.images && p.images.length > 0) ? p.images[0] : 'https://via.placeholder.com/250';
                
                container.innerHTML += `
                    <div class="product-card">
                        <img src="${mainImage}" class="product-image" alt="${p.name}">
                        <div class="product-info">
                            <h2 class="product-title">${p.name}</h2>
                            <div class="product-price">${p.price} دج</div>
                        </div>
                        <button class="btn-buy" onclick="openOrderModal(${JSON.stringify(p).background = ''})">طلب المنتج الآن</button>
                    </div>
                `;
            });
        } catch (error) {
            console.error("حدث خطأ أثناء جلب المنتجات:", error);
        }
    }

    // 2. فتح نافذة الشراء وتجهيز الخيارات (الألوان والمقاسات) التي أدخلتها أنت يدوياً
    function openOrderModal(product) {
        currentProduct = product;
        document.getElementById('modalProductTitle').innerText = `طلب: ${product.name}`;
        document.getElementById('modalProductPrice').innerText = `السعر: ${product.price} دج`;
        
        // تعبئة الألوان المتاحة للمنتج
        const colorSelect = document.getElementById('selectedColor');
        colorSelect.innerHTML = '';
        product.colors.forEach(color => {
            colorSelect.innerHTML += `<option value="${color}">${color}</option>`;
        });

        // تعبئة المقاسات المتاحة للمنتج
        const sizeSelect = document.getElementById('selectedSize');
        sizeSelect.innerHTML = '';
        product.sizes.forEach(size => {
            sizeSelect.innerHTML += `<option value="${size}">${size}</option>`;
        });

        document.getElementById('orderModal').classList.add('show');
    }

    function closeOrderModal() {
        document.getElementById('orderModal').classList.remove('show');
    }

    // 3. إرسال الطلب إلى Firebase وتليجرام معاً
    async function submitOrder() {
        const name = document.getElementById('clientName').value.trim();
        const phone = document.getElementById('clientPhone').value.trim();
        const wilaya = document.getElementById('clientWilaya').value;
        const color = document.getElementById('selectedColor').value;
        const size = document.getElementById('selectedSize').value;

        if (!name || !phone || !wilaya) {
            alert("الرجاء ملء الاسم، رقم الهاتف، واختيار الولاية!");
            return;
        }

        const orderData = {
            name,
            phone,
            wilaya,
            product: `${currentProduct.name} (لون: ${color} / مقاس: ${size})`,
            status: "قيد الانتظار",
            date: new Date().toLocaleString('ar-DZ')
        };

        try {
            // حفظ في الـ Firebase لكي تظهر في لوحة التحكم
            await fetch(`${FIREBASE_BASE_URL}/orders.json`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(orderData)
            });

            // إرسال إشعار فوري لتليجرام
            const telegramMessage = `🔔 طلب جديد وادد!\n\n👤 الزبون: ${name}\n📞 الهاتف: ${phone}\n📍 الولاية: ${wilaya}\n📦 المنتج: ${currentProduct.name}\n🎨 اللون: ${color}\n📏 المقاس: ${size}\n💰 السعر: ${currentProduct.price} دج`;
            
            await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: telegramMessage })
            });

            alert("🎉 تم تسجيل طلبك بنجاح! سنتصل بك هاتفياً لتأكيده قريباً.");
            closeOrderModal();
            
            // تفريغ الاستمارة
            document.getElementById('clientName').value = '';
            document.getElementById('clientPhone').value = '';
            document.getElementById('clientWilaya').value = '';
        } catch (error) {
            alert("حدث خطأ أثناء إرسال الطلب، حاول مرة أخرى.");
        }
    }

    // تشغيل جلب المنتجات فور فتح الصفحة
    fetchCloudProducts();
</script>
</body>
</html>
