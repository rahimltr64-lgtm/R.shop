<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هواتف ماركت | لوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root { --main-dark: #0f172a; --card-bg: #1e293b; --accent-red: #ef4444; --accent-green: #10b981; --accent-blue: #3b82f6; --accent-gold: #f59e0b; --text-main: #f8fafc; --text-muted: #94a3b8; --border-color: #334155; }
        * { box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--main-dark); margin: 0; padding: 25px; color: var(--text-main); }
        .dash-container { max-width: 1400px; margin: auto; display: none; }
        header { background: linear-gradient(135deg, #1e293b, #0f172a); padding: 20px 30px; border-radius: 24px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border: 1px solid var(--border-color); }
        .btn-add { background: linear-gradient(135deg, var(--accent-green), #059669); border: none; padding: 12px 24px; border-radius: 14px; color: white; font-weight: 700; cursor: pointer; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card-bg); padding: 20px; border-radius: 20px; display: flex; justify-content: space-between; align-items: center; }
        .stat-num { font-size: 28px; font-weight: 900; display: block; }
        .card { background: var(--card-bg); border-radius: 24px; padding: 25px; margin-bottom: 30px; }
        .filter-bar { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        input, select { padding: 12px; background: #0f172a; border: 1px solid var(--border-color); color: white; border-radius: 12px; }
        .custom-table { width: 100%; border-collapse: collapse; }
        .custom-table th, .custom-table td { padding: 12px; border-bottom: 1px solid var(--border-color); text-align: right; }
        .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; }
        .status-pending { background: rgba(245,158,11,0.2); color: #f59e0b; }
        .product-thumb { width: 45px; height: 45px; object-fit: contain; background: white; border-radius: 8px; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-overlay.show { display: flex; }
        .modal-box { background: var(--card-bg); padding: 30px; border-radius: 28px; width: 90%; max-width: 650px; max-height: 85vh; overflow-y: auto; }
        .images-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; margin-top: 10px; }
        .btn-delete { background: rgba(239,68,68,0.2); border: none; color: var(--accent-red); padding: 8px 12px; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div class="login-overlay" id="loginOverlay" style="position:fixed; inset:0; background:var(--main-dark); display:flex; align-items:center; justify-content:center; z-index:9999;">
    <div style="background:var(--card-bg); padding:40px; border-radius:28px; text-align:center;">
        <i class="fas fa-lock" style="font-size:50px; color:var(--accent-gold);"></i>
        <h2>لوحة التحكم</h2>
        <input type="password" id="adminPassInput" placeholder="كلمة المرور" style="text-align:center;">
        <button class="btn-add" style="margin-top:15px;" onclick="checkAdminPassword()">دخول</button>
        <p id="loginError" style="color:red; display:none;">خطأ</p>
    </div>
</div>

<div class="dash-container" id="dashContainer">
    <header>
        <h1><i class="fas fa-mobile-alt"></i> هواتف ماركت - الإدارة</h1>
        <button class="btn-add" onclick="openModal()"><i class="fas fa-plus"></i> إضافة هاتف</button>
    </header>
    <div class="stats-grid">
        <div class="stat-card"><div><h3>المنتجات</h3><span class="stat-num" id="totalProductsNum">0</span></div><i class="fas fa-boxes" style="font-size:30px;"></i></div>
        <div class="stat-card"><div><h3>الطلبات</h3><span class="stat-num" id="totalOrdersNum">0</span></div><i class="fas fa-shopping-cart" style="font-size:30px;"></i></div>
        <div class="stat-card"><div><h3>المبيعات</h3><span class="stat-num" id="totalSalesNum" style="color:var(--accent-gold);">0 DA</span></div><i class="fas fa-coins" style="font-size:30px;"></i></div>
    </div>

    <div class="card">
        <h2>📱 قائمة الهواتف</h2>
        <div style="overflow-x:auto;"><table class="custom-table"><thead><tr><th>ID</th><th>الصورة</th><th>الاسم</th><th>الفئة</th><th>السعر</th><th>التكلفة</th><th>حذف</th></tr></thead><tbody id="productsTableBody"></tbody></table></div>
    </div>

    <div class="card">
        <h2>📦 الطلبات</h2>
        <div class="filter-bar"><input type="text" id="orderSearchInput" placeholder="بحث..." oninput="filterOrders()"><select id="statusFilterSelect" onchange="filterOrders()"><option value="all">الكل</option><option value="قيد الانتظار">قيد الانتظار</option><option value="تم التأكيد">تم التأكيد</option><option value="تم الشحن">تم الشحن</option></select></div>
        <div style="overflow-x:auto;"><table class="custom-table"><thead><tr><th>رقم الطلب</th><th>العميل</th><th>الهاتف</th><th>الولاية</th><th>المنتج</th><th>المجموع</th><th>الحالة</th><th>تعديل</th></tr></thead><tbody id="ordersTableBody"></tbody></table></div>
    </div>
</div>

<div class="modal-overlay" id="productModal" onclick="closeModal(event)">
    <div class="modal-box">
        <h2><i class="fas fa-plus"></i> إضافة هاتف جديد</h2>
        <input type="number" id="p_id" placeholder="رقم ID">
        <select id="p_cat"><option value="آيفون">آيفون</option><option value="سامسونج">سامسونج</option><option value="شاومي">شاومي</option><option value="هواوي">هواوي</option><option value="مجدد">مجدد</option><option value="إكسسوارات">إكسسوارات</option></select>
        <input type="text" id="p_name" placeholder="اسم الهاتف">
        <div style="display:flex; gap:10px;"><input type="number" id="p_price" placeholder="سعر البيع"><input type="number" id="p_cost" placeholder="سعر الشراء"></div>
        <input type="text" id="p_colors" placeholder="الألوان (أسود,أبيض)">
        <input type="text" id="p_storage" placeholder="السعات (128GB,256GB)">
        <input type="text" id="p_ram" placeholder="الرام (6GB,8GB)">
        <input type="text" id="p_warranty" placeholder="الضمان (12 شهر)">
        <div class="images-grid"><input type="url" id="p_img1" placeholder="الصورة الرئيسية"><input type="url" id="p_img2" placeholder="صورة2"><input type="url" id="p_img3" placeholder="صورة3"><input type="url" id="p_img4" placeholder="صورة4"></div>
        <button class="btn-add" onclick="uploadProduct()">نشر</button>
    </div>
</div>

<script>
    const CONFIG = { FIREBASE_BASE_URL: "https://fast-store-5cb17-default-rtdb.firebaseio.com", ADMIN_PASSWORD: "Admin2026" };
    let allOrders = {}, allProducts = {};

    function checkAdminPassword() { if(document.getElementById('adminPassInput').value === CONFIG.ADMIN_PASSWORD) { localStorage.setItem('isStoreAdmin','true'); document.getElementById('loginOverlay').style.display='none'; document.getElementById('dashContainer').style.display='block'; loadData(); setInterval(loadData,30000); } else { document.getElementById('loginError').style.display='block'; } }
    if(localStorage.getItem('isStoreAdmin')==='true') { document.getElementById('loginOverlay').style.display='none'; document.getElementById('dashContainer').style.display='block'; loadData(); }

    async function loadData() {
        const p = await fetch(`${CONFIG.FIREBASE_BASE_URL}/products.json`); allProducts = await p.json()||{};
        const o = await fetch(`${CONFIG.FIREBASE_BASE_URL}/orders.json`); allOrders = await o.json()||{};
        renderProducts(); renderOrders(); calcStats();
    }

    function renderProducts() {
        let html = ''; let count=0;
        for(let key in allProducts) { let p=allProducts[key]; if(!p) continue; count++; html+=`<tr><td>#${p.id}</td><td><img src="${p.images?.[0]||''}" class="product-thumb"></td><td>${p.name}</td><td>${p.category}</td><td>${p.price} DA</td><td>${p.cost||0} DA</td><td><button class="btn-delete" onclick="deleteProduct('${key}')"><i class="fas fa-trash"></i></button></td></tr>`; }
        document.getElementById('productsTableBody').innerHTML = html;
        document.getElementById('totalProductsNum').innerText = count;
    }

    function renderOrders() { filterOrders(); }

    function filterOrders() {
        let search = document.getElementById('orderSearchInput').value.toLowerCase();
        let status = document.getElementById('statusFilterSelect').value;
        let html = ''; let count=0; let sales=0;
        for(let key in allOrders) { let o=allOrders[key]; if(!o) continue;
            if(search && !o.name.toLowerCase().includes(search) && !o.product.toLowerCase().includes(search)) continue;
            if(status!=='all' && o.status!==status) continue;
            count++; if(o.status==='تم التأكيد'||o.status==='تم الشحن') sales+=o.totalPrice;
            let badgeClass = 'status-pending'; if(o.status==='تم التأكيد') badgeClass='status-pending'; if(o.status==='تم الشحن') badgeClass='status-pending';
            html+=`<tr><td>${o.orderId}</td><td>${o.name}</td><td>${o.phone}</td><td>${o.wilaya}</td><td><small>${o.product}</small></td><td>${o.totalPrice} DA</td><td><span class="status-badge ${badgeClass}">${o.status||'قيد الانتظار'}</span></td><td><select onchange="updateStatus('${key}',this.value)"><option value="">تغيير</option><option value="قيد الانتظار">قيد الانتظار</option><option value="تم التأكيد">تم التأكيد</option><option value="تم الشحن">تم الشحن</option></select></td></tr>`;
        }
        document.getElementById('ordersTableBody').innerHTML = html;
        document.getElementById('totalOrdersNum').innerText = count;
        document.getElementById('totalSalesNum').innerHTML = sales.toLocaleString() + ' DA';
    }

    async function updateStatus(key, newStatus) { if(newStatus) { await fetch(`${CONFIG.FIREBASE_BASE_URL}/orders/${key}.json`,{method:'PATCH',body:JSON.stringify({status:newStatus})}); loadData(); } }
    async function deleteProduct(key) { if(confirm('حذف؟')) await fetch(`${CONFIG.FIREBASE_BASE_URL}/products/${key}.json`,{method:'DELETE'}); loadData(); }
    async function uploadProduct() {
        let id=document.getElementById('p_id').value, cat=document.getElementById('p_cat').value, name=document.getElementById('p_name').value, price=parseInt(document.getElementById('p_price').value), cost=parseInt(document.getElementById('p_cost').value)||0;
        let colors=document.getElementById('p_colors').value.split(','), storage=document.getElementById('p_storage').value.split(','), ram=document.getElementById('p_ram').value, warranty=document.getElementById('p_warranty').value;
        let images=[]; for(let i=1;i<=4;i++) { let v=document.getElementById(`p_img${i}`).value; if(v) images.push(v); }
        let data={id:parseInt(id),category:cat,name,price,cost,colors,storage,ram,warranty,images};
        await fetch(`${CONFIG.FIREBASE_BASE_URL}/products/${id}.json`,{method:'PUT',body:JSON.stringify(data)});
        alert('تمت الإضافة'); closeModal(); loadData();
    }
    function openModal() { document.getElementById('productModal').classList.add('show'); }
    function closeModal(e) { if(!e || e.target===document.getElementById('productModal')) document.getElementById('productModal').classList.remove('show'); }
    function calcStats() { let total=0; for(let k in allOrders) if(allOrders[k].status==='تم التأكيد'||allOrders[k].status==='تم الشحن') total+=allOrders[k].totalPrice; document.getElementById('totalSalesNum').innerHTML = total.toLocaleString() + ' DA'; }
</script>
</body>
</html>
