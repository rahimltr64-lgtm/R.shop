<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXURY STORE | متجر الفخامة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --gold-light: #f1c40f; --dark: #0a0a0a; --card: #141414; --white: #ffffff; }
        body { font-family: 'Cairo', sans-serif; margin: 0; background: var(--dark); color: var(--white); direction: rtl; overflow-x: hidden; }
        header { background: #111; padding: 20px; text-align: center; border-bottom: 2px solid var(--gold); position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 28px; font-weight: 900; color: var(--gold); text-transform: uppercase; margin: 0; letter-spacing: 2px; }
        .container { max-width: 500px; margin: auto; padding: 15px; }
        
        /* تصميم كروت المنتجات */
        .product-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        .p-card { background: var(--card); border-radius: 20px; overflow: hidden; border: 1px solid #222; cursor: pointer; transition: 0.3s; }
        .p-card img { width: 100%; height: 350px; object-fit: cover; }
        .p-card-info { padding: 15px; text-align: center; }
        .p-card-info h3 { margin: 10px 0; font-size: 18px; }
        .p-price { color: var(--gold); font-size: 24px; font-weight: 900; }

        /* صفحة المنتج */
        #product-page { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark); z-index: 2000; overflow-y: auto; }
        .back-btn { margin: 15px; background: rgba(255,255,255,0.05); color: white; border: 1px solid var(--gold); padding: 8px 20px; border-radius: 50px; cursor: pointer; font-family: 'Cairo'; }
        
        .slider-box { width: 100%; height: 450px; border-radius: 15px; overflow: hidden; background: #000; display: flex; align-items: center; }
        .slider-box img { width: 100%; height: 100%; object-fit: contain; }
        
        .thumbs { display: flex; gap: 10px; margin-top: 15px; overflow-x: auto; padding: 5px; -webkit-overflow-scrolling: touch; }
        .thumbs::-webkit-scrollbar { display: none; }
        .thumb { width: 75px; height: 75px; flex-shrink: 0; border-radius: 10px; border: 2px solid #222; cursor: pointer; object-fit: cover; }
        .thumb.active { border-color: var(--gold); transform: scale(1.05); }

        /* قسم الطلب */
        .order-section { background: #111; border: 1px solid #333; border-top: 3px solid var(--gold); border-radius: 25px 25px 0 0; padding: 25px; margin-top: 20px; }
        .total-banner { background: linear-gradient(90deg, transparent, rgba(212,175,55,0.1), transparent); border-top: 1px solid var(--gold); border-bottom: 1px solid var(--gold); padding: 15px; text-align: center; margin-bottom: 20px; font-size: 20px; }
        
        input, select { width: 100%; padding: 14px; margin: 8px 0; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 12px; font-family: 'Cairo'; font-size: 16px; outline: none; transition: 0.3s; }
        input:focus, select:focus { border-color: var(--gold); }
        
        label { display: block; margin-top: 10px; font-size: 13px; color: var(--gold); font-weight: bold; }
        .selection-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        .buy-now-btn { background: linear-gradient(45deg, var(--gold), var(--gold-light)); color: black; border: none; padding: 18px; width: 100%; border-radius: 12px; font-size: 20px; font-weight: 900; cursor: pointer; margin-top: 15px; }
        
        .success-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark); z-index: 5000; display: none; align-items: center; justify-content: center; text-align: center; padding: 20px; }
    </style>
</head>
<body>

<header><h1 class="logo">LUXURY STORE</h1></header>

<div class="container" id="home-view">
    <div class="product-grid" id="main-grid"></div>
</div>

<div id="product-page">
    <button class="back-btn" onclick="closeP()">⬅️ العودة للمتجر</button>
    <div id="p-content" class="container"></div>
</div>

<div class="success-overlay" id="successScreen">
    <div>
        <div style="font-size:80px;">✅</div>
        <h1 style="color:var(--gold);">تم إرسال طلبك بنجاح!</h1>
        <p>شكراً لك <b id="clientName"></b>. سنتصل بك قريباً لتأكيد طلبك.</p>
        <button class="buy-now-btn" onclick="location.reload()" style="width:200px;">إغلاق</button>
    </div>
</div>

<script>
    // بياناتك الخاصة - محفوظة وجاهزة
    const TOKEN = "8447738345:AAHgpNg_aRPIZAZRsg1tJ4OGjYqA7Tl0ZjM"; 
    const CHAT_ID = "5981194410";

    const products = [
        {
            id: 1,
            name: "T-SHIRT صيفي بعدة ألوان",
            price: 1000,
            colors: ["ازرق داكن", "أبيض", "اسود", "عنابي", "أزرق بارد", "وردي", "اخضر بارد"],
            sizes: ["M", "L", "XL"],
            images: [
                "https://i.postimg.cc/SsfTkWHW/1778252993790.png",
                "https://i.postimg.cc/xCn5xXq7/1778253038445.png",
                "https://i.postimg.cc/pXTGM5CJ/1778251954636.png",
                "https://i.postimg.cc/76F8cM8b/1778253686102.png",
                "https://i.postimg.cc/FH8mt4Q0/1778253106574.png",
                "https://i.postimg.cc/CKnhdK43/1778252936394.png",
                "https://i.postimg.cc/8C8tvKSK/1778252209457.png"
            ]
        }
    ];

    const wilayas = [
        {n: "01-أدرار", p: 1000}, {n: "02-الشلف", p: 600}, {n: "03-الأغواط", p: 700}, {n: "04-أم البواقي", p: 600}, {n: "05-باتنة", p: 600},
        {n: "06-بجاية", p: 600}, {n: "07-بسكرة", p: 600}, {n: "08-بشار", p: 1000}, {n: "09-البليدة", p: 450}, {n: "10-البويرة", p: 600},
        {n: "11-تمنراست", p: 1200}, {n: "12-تبسة", p: 600}, {n: "13-تلمسان", p: 700}, {n: "14-تيارت", p: 700}, {n: "15-تيزي وزو", p: 600},
        {n: "16-الجزائر العاصمة", p: 400}, {n: "17-الجلفة", p: 700}, {n: "18-جيجل", p: 600}, {n: "19-سطيف", p: 300}, {n: "20-سعيدة", p: 700},
        {n: "21-سكيكدة", p: 600}, {n: "22-سيدي بلعباس", p: 700}, {n: "23-عنابة", p: 600}, {n: "24-قالمة", p: 600}, {n: "25-قسنطينة", p: 500},
        {n: "26-المدية", p: 600}, {n: "27-مستغانم", p: 700}, {n: "28-المسيلة", p: 650}, {n: "29-معسكر", p: 700}, {n: "30-ورقلة", p: 800},
        {n: "31-وهران", p: 600}, {n: "32-البيض", p: 850}, {n: "33-إليزي", p: 1200}, {n: "34-برج بوعريريج", p: 500}, {n: "35-بومرداس", p: 500},
        {n: "36-الطارف", p: 650}, {n: "37-تندوف", p: 1200}, {n: "38-تسمسيلت", p: 700}, {n: "39-الوادي", p: 800}, {n: "40-خنشلة", p: 600},
        {n: "41-سوق أهراس", p: 650}, {n: "42-تيبازة", p: 500}, {n: "43-ميلة", p: 550}, {n: "44-عين الدفلى", p: 650}, {n: "45-النعامة", p: 850},
        {n: "46-عين تموشنت", p: 700}, {n: "47-غرداية", p: 800}, {n: "48-غليزان", p: 700}, {n: "49-تيميمون", p: 1000}, {n: "50-برج باجي مختار", p: 1500},
        {n: "51-أولاد جلال", p: 750}, {n: "52-بني عباس", p: 1000}, {n: "53-إن صالح", p: 1200}, {n: "54-إن قزام", p: 1500}, {n: "55-تقرت", p: 800},
        {n: "56-جانت", p: 1500}, {n: "57-المغير", p: 750}, {n: "58-المنيعة", p: 900}
    ];

    const grid = document.getElementById('main-grid');
    products.forEach(p => {
        grid.innerHTML += `
            <div class="p-card" onclick="openP(${p.id})">
                <img src="${p.images[0]}">
                <div class="p-card-info">
                    <h3>${p.name}</h3>
                    <div class="p-price">${p.price} دج</div>
                </div>
            </div>`;
    });

    let current = null;
    function openP(id) {
        current = products.find(x => x.id === id);
        let w_opts = `<option value="none">-- اختر ولايتك --</option>` + wilayas.map(w => `<option value="${w.p}">${w.n}</option>`).join('');

        document.getElementById('p-content').innerHTML = `
            <div class="slider-box"><img src="${current.images[0]}" id="activeImg"></div>
            <div class="thumbs">${current.images.map((img, i) => `<img src="${img}" class="thumb ${i===0?'active':''}" onclick="changeGallery(this, '${img}')">`).join('')}</div>
            
            <h2 style="text-align:center; margin: 20px 0;">${current.name}</h2>
            
            <div class="order-section">
                <div class="total-banner">الإجمالي: <span id="finalPrice">${current.price}</span> دج</div>
                
                <div class="selection-group">
                    <div><label>اللون:</label><select id="custColor">${current.colors.map(c => `<option value="${c}">${c}</option>`).join('')}</select></div>
                    <div><label>المقاس:</label><select id="custSize">${current.sizes.map(s => `<option value="${s}">${s}</option>`).join('')}</select></div>
                </div>

                <label>معلومات التواصل:</label>
                <input type="text" id="custN" placeholder="الإسم الكامل">
                <input type="tel" id="custPh" placeholder="رقم الهاتف">
                
                <label>الشحن والولاية:</label>
                <select id="custW" onchange="updateTotal()">${w_opts}</select>
                <select id="deliveryType" onchange="updateTotal()">
                    <option value="home">توصيل للمنزل</option>
                    <option value="office">استلام من المكتب (خصم 200 دج)</option>
                </select>
                <input type="text" id="custC" placeholder="البلدية والعنوان بالتفصيل">
                
                <button class="buy-now-btn" id="sendBtn" onclick="send()">تأكيد الطلبية 🛒</button>
            </div>`;
        document.getElementById('product-page').style.display = 'block';
        window.scrollTo(0,0);
    }

    function changeGallery(el, src) {
        document.getElementById('activeImg').src = src;
        document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
    }

    function updateTotal() {
        const w_val = document.getElementById('custW').value;
        const d_type = document.getElementById('deliveryType').value;
        let shipping = w_val === "none" ? 0 : parseInt(w_val);
        if(d_type === "office" && shipping > 200) shipping -= 200;
        document.getElementById('finalPrice').innerText = current.price + shipping;
    }

    function send() {
        const n = document.getElementById('custN').value;
        const ph = document.getElementById('custPh').value;
        const w_sel = document.getElementById('custW');
        const c = document.getElementById('custC').value;
        
        if(n && ph && c && w_sel.value !== "none") {
            document.getElementById('sendBtn').innerText = "جاري الإرسال...";
            const msg = `👑 طلبية جديدة:\n📦 المنتج: ${current.name}\n🎨 اللون: ${document.getElementById('custColor').value}\n📏 المقاس: ${document.getElementById('custSize').value}\n👤 العميل: ${n}\n📞 الهاتف: ${ph}\n📍 الولاية: ${w_sel.options[w_sel.selectedIndex].text}\n💰 الإجمالي: ${document.getElementById('finalPrice').innerText} دج`;
            
            fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, text: msg })
            }).then(res => {
                if(res.ok) {
                    document.getElementById('clientName').innerText = n;
                    document.getElementById('successScreen').style.display = 'flex';
                }
            });
        } else { alert("يرجى ملء كافة الخانات"); }
    }

    function closeP() { document.getElementById('product-page').style.display = 'none'; }
</script>
</body>
</html>
