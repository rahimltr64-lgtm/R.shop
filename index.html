<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXURY STORE | متجر الفخامة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --main: #1a1a1a; --bg: #f2f4f7; --card-bg: #ffffff; --radius: 30px; --accent: #e67e22; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Cairo', sans-serif; margin: 0; background: var(--bg); color: #222; overflow-x: hidden; }
        
        header { 
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px);
            padding: 20px; text-align: center; position: sticky; top: 0; z-index: 1000;
            border-bottom: 1px solid rgba(0,0,0,0.03);
        }
        .logo { font-size: 20px; font-weight: 900; color: var(--main); letter-spacing: 4px; margin: 0; }
        .container { max-width: 500px; margin: auto; padding: 25px 15px; }

        .p-card { 
            background: var(--card-bg); border-radius: var(--radius); overflow: hidden; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.06); border: 1px solid rgba(255,255,255,0.8);
            transition: 0.3s ease; cursor: pointer;
        }
        .p-img-hold { width: 100%; height: 420px; background: #fff; overflow: hidden; }
        .p-card img { width: 100%; height: 100%; object-fit: contain; }
        .p-info { padding: 25px; text-align: center; background: #fff; border-top: 1px solid #f0f0f0; }
        .p-name { font-size: 18px; font-weight: 700; color: #444; margin-bottom: 8px; }
        .p-price-tag { font-weight: 900; color: var(--main); font-size: 24px; display: block; }

        #product-page { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #f8f9fb; z-index: 2000; overflow-y: auto;
            animation: slideIn 0.5s cubic-bezier(0.19, 1, 0.22, 1);
        }
        @keyframes slideIn { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .back-nav { padding: 20px; position: fixed; top: 0; width: 100%; z-index: 2001; }
        .close-circle { width: 45px; height: 45px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 20px rgba(0,0,0,0.08); cursor: pointer; }

        .hero-slider { width: 100%; height: 50vh; background: #fff; display: flex; align-items: center; border-radius: 0 0 50px 50px; }
        .hero-slider img { width: 100%; height: 90%; object-fit: contain; }
        
        .thumbs-strip { display: flex; gap: 15px; padding: 25px; overflow-x: auto; }
        .t-item { width: 75px; height: 75px; flex-shrink: 0; border-radius: 20px; border: 2px solid transparent; background: #fff; box-shadow: 0 8px 15px rgba(0,0,0,0.04); }
        .t-item.active { border-color: var(--main); }

        .order-form { padding: 0 20px 50px 20px; }
        .white-card { background: #fff; border-radius: 30px; padding: 25px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.03); }
        
        .final-price-box { background: var(--main); color: #fff; padding: 20px; border-radius: 25px; text-align: center; margin-bottom: 25px; position: relative; }
        .final-price-box span { font-size: 32px; font-weight: 900; }
        .discount-badge { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: var(--accent); color: white; padding: 4px 15px; border-radius: 10px; font-size: 12px; font-weight: bold; display: none; }

        label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 700; color: #999; }
        input, select { width: 100%; padding: 18px; border-radius: 20px; border: 1px solid #eee; background: #f9f9f9; font-family: 'Cairo'; font-size: 16px; outline: none; margin-bottom: 12px; }

        .offer-tag { background: #fff3cd; color: #856404; padding: 10px; border-radius: 15px; font-size: 14px; text-align: center; margin-bottom: 15px; border: 1px dashed #ffeeba; }
        .btn-send { background: var(--main); color: #fff; border: none; width: 100%; padding: 22px; border-radius: 22px; font-size: 20px; font-weight: 700; cursor: pointer; box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
        .success-overlay { position: fixed; inset: 0; background: #fff; z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; }
    </style>
</head>
<body>

<header><div class="logo">LUXURY STORE</div></header>

<div class="container" id="home-view">
    <div class="product-grid" id="main-grid"></div>
</div>

<div id="product-page">
    <div class="back-nav"><div class="close-circle" onclick="closeP()">✕</div></div>
    <div id="p-content"></div>
</div>

<div class="success-overlay" id="successScreen">
    <div style="font-size: 80px; margin-bottom: 20px;">✅</div>
    <h1>تم استلام طلبك!</h1>
    <p>سنتصل بك لتأكيد الألوان وشحن طلبك عبر <b>Noest Express</b>.</p>
    <button class="btn-send" onclick="location.reload()" style="width: 200px; margin-top: 20px;">حسناً</button>
</div>

<script>
    const TOKEN = "8447738345:AAHgpNg_aRPIZAZRsg1tJ4OGjYqA7Tl0ZjM"; 
    const CHAT_ID = "5981194410";

    const products = [{
        id: 1,
        name: "Armani Exchange Premium",
        price: 1000,
        colors: ["أبيض ملكي", "اسود فخم", "ازرق داكن", "عنابي", "أزرق بارد", "وردي", "اخضر بارد"],
        sizes: ["M", "L", "XL"],
        images: [
            "https://i.postimg.cc/3xYKhDnW/1778264788756.png",
            "https://i.postimg.cc/SsfTkWHW/1778252993790.png",
            "https://i.postimg.cc/pXTGM5CJ/1778251954636.png",
            "https://i.postimg.cc/CKnhdK43/1778252936394.png",
            "https://i.postimg.cc/xCn5xXq7/1778253038445.png",
            "https://i.postimg.cc/FH8mt4Q0/1778253106574.png",
            "https://i.postimg.cc/8C8tvKSK/1778252209457.png"
        ]
    }];

    const wilayas = [
        {n: "01-أدرار", p: 1200}, {n: "02-الشلف", p: 800}, {n: "03-الأغواط", p: 900}, {n: "04-أم البواقي", p: 800},
        {n: "05-باتنة", p: 850}, {n: "06-بجاية", p: 750}, {n: "07-بسكرة", p: 900}, {n: "08-بشار", p: 1000},
        {n: "09-البليدة", p: 600}, {n: "10-البويرة", p: 700}, {n: "11-تمنراست", p: 1400}, {n: "12-تبسة", p: 850},
        {n: "13-تلمسان", p: 850}, {n: "14-تيارت", p: 800}, {n: "15-تيزي وزو", p: 700}, {n: "16-الجزائر", p: 400},
        {n: "17-الجلفة", p: 900}, {n: "18-جيجل", p: 800}, {n: "19-سطيف", p: 750}, {n: "20-سعيدة", p: 850},
        {n: "21-سكيكدة", p: 850}, {n: "22-سيدي بلعباس", p: 850}, {n: "23-عنابة", p: 800}, {n: "24-قالمة", p: 800},
        {n: "25-قسنطينة", p: 750}, {n: "26-المدية", p: 750}, {n: "27-مستغانم", p: 850}, {n: "28-المسيلة", p: 800},
        {n: "29-معسكر", p: 850}, {n: "30-ورقلة", p: 900}, {n: "31-وهران", p: 750}, {n: "32-البيض", p: 950},
        {n: "33-إليزي", p: 1400}, {n: "34-برج بوعريريج", p: 750}, {n: "35-بومرداس", p: 650}, {n: "36-الطارف", p: 850},
        {n: "37-تندوف", p: 1400}, {n: "38-تيسمسيلت", p: 850}, {n: "39-الوادي", p: 900}, {n: "40-خنشلة", p: 850},
        {n: "41-سوق أهراس", p: 850}, {n: "42-تيبازة", p: 650}, {n: "43-ميلة", p: 850}, {n: "44-عين الدفلى", p: 800},
        {n: "45-النعامة", p: 950}, {n: "46-عين تموشنت", p: 850}, {n: "47-غرداية", p: 900}, {n: "48-غليزان", p: 800},
        {n: "49-تيميمون", p: 1200}, {n: "50-برج باجي مختار", p: 1500}, {n: "51-أولاد جلال", p: 900}, {n: "52-بني عباس", p: 1000},
        {n: "53-عين صالح", p: 1400}, {n: "54-عين قزام", p: 1500}, {n: "55-تقرت", p: 900}, {n: "56-جانت", p: 1500},
        {n: "57-المغير", p: 900}, {n: "58-المنيعة", p: 1000}
    ];

    const grid = document.getElementById('main-grid');
    products.forEach(p => {
        grid.innerHTML += `
            <div class="p-card" onclick="openP(${p.id})">
                <div class="p-img-hold"><img src="${p.images[0]}"></div>
                <div class="p-info">
                    <div class="p-name">${p.name}</div>
                    <div class="p-price-tag">1000 DA <small style="font-size:11px; color:var(--accent)">(2 بـ 1800)</small></div>
                </div>
            </div>`;
    });

    function openP(id) {
        const p = products.find(x => x.id === id);
        let w_opts = `<option value="none">اختر الولاية</option>` + wilayas.map(w => `<option value="${w.p}">${w.n}</option>`).join('');

        document.getElementById('p-content').innerHTML = `
            <div class="hero-slider"><img src="${p.images[0]}" id="activeImg"></div>
            <div class="thumbs-strip">${p.images.map((img, i) => `<img src="${img}" class="t-item ${i===0?'active':''}" onclick="changeGallery(this, '${img}')">`).join('')}</div>
            
            <div class="order-form">
                <div class="offer-tag">✨ عرض: قطعتين بـ <b>1800 دج</b> (يمكنك اختيار ألوان مختلفة)</div>
                <div class="final-price-box">
                    <div class="discount-badge" id="disBadge">وفرت 200 دج! 😍</div>
                    <small>الإجمالي شامل التوصيل</small><br><span id="finalPrice">${p.price}</span> DA
                </div>
                <div class="white-card">
                    <label>الكمية</label>
                    <select id="custQty" onchange="updateTotal()">
                        <option value="1">قطعة واحدة (1000 دج)</option>
                        <option value="2">قطعتين (1800 دج) 🔥</option>
                    </select>
                    
                    <div style="padding:10px 0;">
                        <label>القطعة الأولى:</label>
                        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
                            <select id="custColor">${p.colors.map(c => `<option value="${c}">${c}</option>`).join('')}</select>
                            <select id="custSize">${p.sizes.map(s => `<option value="${s}">${s}</option>`).join('')}</select>
                        </div>
                    </div>

                    <div id="second-item-options" style="display:none; border-top: 1px dashed #eee; padding-top: 15px; margin-top: 10px;">
                        <label style="color:var(--accent)">القطعة الثانية (اختياري):</label>
                        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
                            <select id="custColor2">${p.colors.map(c => `<option value="${c}">${c}</option>`).join('')}</select>
                            <select id="custSize2">${p.sizes.map(s => `<option value="${s}">${s}</option>`).join('')}</select>
                        </div>
                    </div>
                </div>
                <div class="white-card">
                    <input type="text" id="custN" placeholder="الإسم الكامل">
                    <input type="tel" id="custPh" placeholder="رقم الهاتف">
                    <select id="custW" onchange="updateTotal()">${w_opts}</select>
                    <select id="deliveryType" onchange="updateTotal()">
                        <option value="home">توصيل للمنزل</option>
                        <option value="office">استلام من المكتب (Noest Desk)</option>
                    </select>
                </div>
                <button class="btn-send" onclick="send()">إرسال الطلب الآن 🛍️</button>
            </div>`;
        document.getElementById('product-page').style.display = 'block';
        document.body.style.overflow = 'hidden';
    }

    function updateTotal() {
        const qty = document.getElementById('custQty').value;
        const w_val = document.getElementById('custW').value;
        const d_type = document.getElementById('deliveryType').value;
        const badge = document.getElementById('disBadge');
        const secondItem = document.getElementById('second-item-options');
        
        let pPrice = (qty === "2") ? 1800 : 1000;
        badge.style.display = (qty === "2") ? 'block' : 'none';
        secondItem.style.display = (qty === "2") ? 'block' : 'none';

        let ship = w_val === "none" ? 0 : parseInt(w_val);
        if(d_type === "office" && ship > 300) ship -= 300;
        
        document.getElementById('finalPrice').innerText = pPrice + ship;
    }

    function send() {
        const n = document.getElementById('custN').value, ph = document.getElementById('custPh').value, w = document.getElementById('custW');
        const qty = document.getElementById('custQty').value;
        
        if(n && ph && w.value !== "none") {
            let colorDetails = `🎨 لون 1: ${document.getElementById('custColor').value} (${document.getElementById('custSize').value})`;
            if(qty === "2") {
                colorDetails += `\n🎨 لون 2: ${document.getElementById('custColor2').value} (${document.getElementById('custSize2').value})`;
            }

            const msg = `📦 طلب جديد Noest!\n👤 الاسم: ${n}\n📞 الهاتف: ${ph}\n📍 الولاية: ${w.options[w.selectedIndex].text}\n🛍️ الكمية: ${qty}\n${colorDetails}\n💰 المجموع: ${document.getElementById('finalPrice').innerText} DA`;
            
            fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, text: msg })
            }).then(res => { if(res.ok) document.getElementById('successScreen').style.display = 'flex'; });
        } else { alert("يرجى إدخال جميع البيانات"); }
    }

    function changeGallery(el, src) {
        document.getElementById('activeImg').src = src;
        document.querySelectorAll('.t-item').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
    }

    function closeP() { document.getElementById('product-page').style.display = 'none'; document.body.style.overflow = 'auto'; }
</script>
</body>
</html>
